[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fintech-quant-data-scientist-interview"
version = "1.0.0"
description = "Interview laboratory for mid-level quantitative data science in FinTech risk and fraud."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Portfolio laboratory" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "pyarrow>=15",
    "matplotlib>=3.8",
    "joblib>=1.3",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "pandera>=0.18",
    "streamlit>=1.32",
    "mlflow>=2.12",
    "xgboost>=2.0",
]

[project.optional-dependencies]
deep = ["torch>=2.2"]
spark = ["pyspark>=3.5"]
dev = ["pytest>=8.0", "ruff>=0.4", "black>=24.0", "nbformat>=5.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
addopts = "--import-mode=importlib -q"
testpaths = ["tests", "python"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]
