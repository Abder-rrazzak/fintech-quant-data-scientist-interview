services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: fintech_lab
      POSTGRES_USER: fintech
      POSTGRES_PASSWORD: fintech
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./snowflake/local/postgres_feature_store.sql:/docker-entrypoint-initdb.d/01_feature_store.sql:ro

  api:
    build: .
    command: python -m uvicorn serving.api:app --host 0.0.0.0 --port 8000
    environment:
      PYTHONPATH: /app/src
      MLFLOW_TRACKING_URI: /app/mlruns
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts
      - ./data:/app/data
    depends_on:
      - postgres

  dashboard:
    build: .
    command: streamlit run app.py --server.address 0.0.0.0 --server.port 8501
    environment:
      PYTHONPATH: /app/src
    ports:
      - "8501:8501"
    volumes:
      - ./artifacts:/app/artifacts
      - ./data:/app/data

volumes:
  pgdata:
